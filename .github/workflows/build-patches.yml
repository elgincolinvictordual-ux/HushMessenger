name: Build patch bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      # The Morphe Gradle plugin comes from GitHub Packages, which wants a login even for public packages.
      # If this step fails with a 401, make a classic token with read:packages and save it as the
      # repository secret PACKAGES_TOKEN.
      - name: Build the bundle
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Keep the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: hush-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      # A release page lets you download the .mpp straight on a phone, with no zip to open first.
      - name: Publish the bundle as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fork-latest --yes --cleanup-tag || true
          gh release create fork-latest patches/build/libs/*.mpp \
            --title "Fork build" \
            --notes "Latest build of this fork. Download the .mpp and add it in Morphe Manager under Sources > + > Local." \
            --prerelease
